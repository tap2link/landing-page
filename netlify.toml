[build]
  command = "npm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# No [[redirects]] here on purpose: the four 301s for app paths typed on the landing host live in
# public/_redirects, because Netlify reads _redirects first and `nuxt generate` writes a catch-all
# into it, so a redirect declared here would never be reached. See that file.
